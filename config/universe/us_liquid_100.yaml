# ~100 liquid US large caps across 11 sector ETFs.
#
# Breadth is the one lever a cross-sectional strategy has that is not a
# parameter: with 22 names the "top 3" sit around the 87th percentile; with 100
# they sit near the 97th, and the extremes of a wider cross-section are
# genuinely more extreme. Widening the universe fits nothing.
#
# Static membership, as with the 22-name list — safe over these windows, wrong
# for a multi-year study (see universe/definition.py).
